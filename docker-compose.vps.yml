version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: triton-postgres-prod
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=TritonNewSite84
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: triton-web-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - /var/lib/triton_uploads:/app/public/uploads
    environment:
      - DATABASE_URL=postgresql://postgres:TritonNewSite84@db:5432/postgres?schema=public
      - SESSION_SECRET
      - BLOB_READ_WRITE_TOKEN
      - STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
      - NEXT_PUBLIC_URL
      - MISTRAL_API_KEY
    command: >
      sh -c "
        npx prisma db push &&
        npm run start
      "

volumes:
  pgdata:
