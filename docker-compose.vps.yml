services:
  db:
    image: postgres:16-alpine
    container_name: triton-postgres-prod
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=TritonNewSite84
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: triton-web-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - /var/lib/triton_uploads:/app/public/uploads
    environment:
      - DATABASE_URL=postgresql://postgres:TritonNewSite84@db:5432/postgres?schema=public
      - SESSION_SECRET=${SESSION_SECRET:-local-development-secret-key-123456789}
      - BLOB_READ_WRITE_TOKEN=${BLOB_READ_WRITE_TOKEN:-vercel_blob_rw_O668kGM0NLjS2W9j_fwjTlDnE1iX7Qcx3IuBMB41EODbq0t}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_51S5tcrLOxXo6f8ZWuQHkJXvPWPQ1lDFb7tYzGFPRw7h244rE1YNdvjiNCaeL44bDrwZqpiHhIN3sldG6RyK0Z2nF00kNH3hHbv}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_test_51S5tcrLOxXo6f8ZWtiePJopwWZaEGqSY0fFHLVOaT9QqBWeqAIDc3Ja6kElSGFCr9aiCm9UEGJZA5CIgthQauulC00ygGM69UN}
      - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL:-http://localhost:3000}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-lJrBYMfUx2uZAOWYkKswSZjdzsCa7wc4}
    command: >
      sh -c "
        npx prisma db push &&
        npm run start
      "

volumes:
  pgdata:
